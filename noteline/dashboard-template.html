<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoteLine — who might sell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Same greenbar ledger as Deedline — sister tools, one family. NoteLine's
   accent is the blue of a bank examiner's pen rather than the court's green. */
:root{
  --paper:#F3F5ED; --bar:#E3EDDE; --raise:#FBFCF7; --sunk:#E9EDE3;
  --ink:#16202A; --muted:#5B6B64; --faint:#8A968E;
  --rule:#C9D4C5; --rule-soft:#DCE4D7;
  --stamp:#B0342C; --stamp-wash:#F6E0DD;
  --ledger:#2A6A52; --ledger-wash:#DDEBE2;
  --blue:#27497A; --blue-wash:#DEE5F0;
  --amber:#8A6512; --amber-wash:#F1E8CE;
  --r:3px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1417; --bar:#141C1E; --raise:#18211F; --sunk:#0A1012;
    --ink:#E4EAE0; --muted:#8D9A92; --faint:#67746C;
    --rule:#26332F; --rule-soft:#1B2624;
    --stamp:#E0736A; --stamp-wash:#2C1917;
    --ledger:#6FC39C; --ledger-wash:#122A21;
    --blue:#8FA9D8; --blue-wash:#161D2B;
    --amber:#D5AB47; --amber-wash:#2A2413;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1417; --bar:#141C1E; --raise:#18211F; --sunk:#0A1012;
  --ink:#E4EAE0; --muted:#8D9A92; --faint:#67746C;
  --rule:#26332F; --rule-soft:#1B2624;
  --stamp:#E0736A; --stamp-wash:#2C1917;
  --ledger:#6FC39C; --ledger-wash:#122A21;
  --blue:#8FA9D8; --blue-wash:#161D2B;
  --amber:#D5AB47; --amber-wash:#2A2413;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:.88em;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:2px solid var(--ink);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.wordmark{font-size:23px;font-weight:700;letter-spacing:-.055em;line-height:1}
.wordmark span{color:var(--blue)}
.slug{font-size:11.5px;color:var(--muted);flex:1;min-width:180px;padding-bottom:2px}
.slug b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{padding:5px 10px;font-size:12.5px;border:1px solid var(--rule);border-radius:var(--r);color:var(--muted);background:var(--raise)}
.tab[aria-selected="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.topbtn{border:1px solid var(--rule);border-radius:var(--r);padding:4px 9px;font-size:12px;color:var(--muted);background:var(--raise)}

.hero{padding:24px 16px 20px;border-bottom:1px solid var(--rule)}
.hero p{margin:0;max-width:50ch;font-size:clamp(20px,3.2vw,29px);line-height:1.22;font-weight:600;letter-spacing:-.03em}
.hero em{font-style:normal;color:var(--blue)}
.hero .hot{color:var(--stamp)}
.meta{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px 10px}
.chip{border:1px solid var(--rule);border-radius:99px;padding:3px 11px;font-size:12.5px;background:var(--raise);color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-wash);color:var(--blue);font-weight:600}
.srch,.sel{padding:5px 8px;border:1px solid var(--rule);border-radius:var(--r);background:var(--raise);font-size:13px}
.srch{flex:1;min-width:150px;max-width:280px}
.count{font-size:12.5px;color:var(--muted);margin-left:auto}
.count b{color:var(--ink)}

.rows{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:0 12px;width:100%;text-align:left;
  padding:9px 16px;border-bottom:1px solid var(--rule-soft);align-items:baseline;position:relative}
.row:nth-child(even){background:var(--bar)}
.row:hover{background:var(--blue-wash)}
.sc{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;text-align:right;letter-spacing:-.04em;line-height:1.1}
.sc s{display:block;text-decoration:none;font-family:'Archivo';font-size:9.5px;font-weight:400;color:var(--faint);letter-spacing:0}
.nm{font-size:14.5px;font-weight:600;letter-spacing:-.017em;margin:0 0 1px}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 5px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:2px;white-space:nowrap;border:1px solid transparent}
.t-call{background:var(--stamp-wash);color:var(--stamp);border-color:var(--stamp)}
.t-watch{background:var(--amber-wash);color:var(--amber);border-color:var(--amber)}
.t-seg{background:var(--blue-wash);color:var(--blue);border-color:var(--blue)}
.t-fc{background:var(--ledger-wash);color:var(--ledger);border-color:var(--ledger)}
.t-q{border-color:var(--rule);color:var(--faint)}
.side{text-align:right;font-size:11.5px;color:var(--faint);white-space:nowrap}
.side b{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-weight:500}
.stamp{position:absolute;right:14px;top:7px;transform:rotate(-7deg);border:1.5px solid var(--stamp);color:var(--stamp);
  border-radius:2px;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:1px 5px;opacity:.85;pointer-events:none}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
@media(max-width:700px){
  .row{grid-template-columns:44px 1fr}
  .side{grid-column:2;text-align:left;margin-top:3px}
  .count{margin-left:0;width:100%}
}

.scrim{position:fixed;inset:0;background:rgba(8,14,12,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100%);z-index:70;background:var(--paper);
  border-left:2px solid var(--ink);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .2s cubic-bezier(.32,.72,0,1)}
.drawer.on{transform:none}
.dhead{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom:2px solid var(--ink);display:flex;gap:12px;align-items:flex-start}
.dhead h2{margin:0 0 2px;font-size:19px;font-weight:700;letter-spacing:-.03em}
.dhead p{margin:0;font-size:12.5px;color:var(--muted)}
.dbody{flex:1;overflow-y:auto;padding:0 18px 40px}
.dsec{padding:15px 0;border-bottom:1px solid var(--rule-soft)}
.dsec h4{margin:0 0 9px;font-size:12.5px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;margin:0}
.kv div{border-left:2px solid var(--rule);padding-left:8px}
.kv dt{color:var(--faint);font-size:11.5px}
.kv dd{margin:0;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500}
.kv dd.bad{color:var(--stamp)}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.why li{font-size:13px;padding-left:15px;position:relative;color:var(--muted)}
.why li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:2px;background:var(--blue)}
.item{background:var(--raise);border:1px solid var(--rule);border-left:2px solid var(--blue);padding:8px 10px;margin-bottom:6px;font-size:13px;border-radius:0 var(--r) var(--r) 0}
.item s{display:block;text-decoration:none;font-size:11.5px;color:var(--faint)}
.links{display:flex;gap:6px;flex-wrap:wrap}
.lnk{padding:6px 10px;border:1px solid var(--rule);border-radius:var(--r);background:var(--raise);color:var(--ink);text-decoration:none;font-size:12.5px}
.lnk:hover{border-color:var(--blue);color:var(--blue)}
.cite{background:var(--sunk);border-left:2px solid var(--muted);padding:9px 11px;font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.segtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.segtbl th{text-align:left;font-weight:500;color:var(--faint);font-size:11.5px;padding:3px 6px 3px 0}
.segtbl td{padding:4px 6px 4px 0;border-top:1px solid var(--rule-soft)}
.segtbl td.n{font-family:'IBM Plex Mono',monospace;text-align:right}
.spark{display:block;margin-top:4px}

.t-sold{background:var(--ledger);color:var(--paper);border-color:var(--ledger)}
.bidline{display:block;margin-top:4px;font-size:12.5px}
.bidline b{font-family:'IBM Plex Mono',monospace}
.muted{color:var(--faint)}
details.calc,details.letter{margin-top:6px}
details summary{cursor:pointer;font-size:12px;color:var(--blue);width:max-content}
.calcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.calcgrid label{font-size:11.5px;color:var(--faint);display:flex;flex-direction:column;gap:2px}
.calcgrid input,.trk input,.trk select,.trk textarea,#asg,#asg-label{padding:5px 7px;border:1px solid var(--rule);border-radius:var(--r);background:var(--raise);font-size:13px;min-width:0}
.calcout{font-size:13px;margin:4px 0;color:var(--ink)}
pre#letter{white-space:pre-wrap;font-family:inherit;font-size:13px;background:var(--raise);border:1px solid var(--rule);padding:10px 12px;border-radius:var(--r);margin:8px 0}
.trkrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:6px 0}
.trkrow label{font-size:11.5px;color:var(--faint);display:flex;flex-direction:column;gap:2px}
.trkrow label.chk{flex-direction:row;align-items:center;gap:5px;color:var(--ink);font-size:12.5px}
.trk textarea,#asg{width:100%;font-family:inherit;margin:6px 0}
.cardbtn{display:block;width:100%;text-align:left;cursor:pointer}
.cardbtn:hover{border-color:var(--blue)}
.copy{border:1px solid var(--rule);border-radius:var(--r);padding:0 6px;font-size:11px;color:var(--muted)}
.hot{color:var(--stamp);font-weight:600}
.panel{padding:18px 16px 50px;max-width:820px}
.panel h2{margin:0 0 5px;font-size:21px;font-weight:700;letter-spacing:-.035em}
.panel>p{margin:0 0 16px;color:var(--muted);font-size:13.5px;max-width:66ch}
.card{border:1px solid var(--rule);background:var(--raise);padding:10px 13px;margin-bottom:7px;border-radius:var(--r)}
.card b{font-size:13.5px}
.card p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.card .n{float:right;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink)}
.status{list-style:none;padding:0;margin:0 0 16px;font-size:12.5px;color:var(--muted)}
.status b{color:var(--ink);font-weight:600;display:inline-block;min-width:80px}
</style>
</head>
<body>
<header class="top">
  <div class="wordmark">Note<span>Line</span></div>
  <div class="slug" id="slug"></div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-view="lenders" aria-selected="true">Lenders</button>
    <button class="tab" role="tab" data-view="foreclosing">Foreclosing now</button>
    <button class="tab" role="tab" data-view="business">Business loans</button>
    <button class="tab" role="tab" data-view="sellers">Proven sellers</button>
    <button class="tab" role="tab" data-view="buyers">Who's buying</button>
    <button class="tab" role="tab" data-view="pipeline" id="tab-pipeline" hidden>Your pipeline</button>
    <button class="tab" role="tab" data-view="about">How to read it</button>
  </nav>
  <button class="topbtn" id="theme" aria-label="Toggle dark mode">◐</button>
</header>

<section class="hero" id="hero"></section>
<div id="view"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="dname">
  <div class="dhead"><div style="flex:1"><h2 id="dname"></h2><p id="dsub"></p></div>
    <button class="topbtn" id="dclose" aria-label="Close">Close</button></div>
  <div class="dbody" id="dbody"></div>
</aside>

<script>
const DATA = /*__NOTELINE_DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const musd = k => k == null ? "—" : (k >= 1e6 ? `$${(k/1e6).toFixed(1)}B` : k >= 1000 ? `$${(k/1000).toFixed(1)}M` : `$${Math.round(k)}K`);
const usd = d => d == null ? "—" : d >= 1e6 ? `$${(d/1e6).toFixed(2)}M` : `$${Math.round(d/1000)}K`;
const pct = v => v == null ? "—" : `${(+v).toFixed(2)}%`;
const qtr = r => r && r.length === 8 ? `Q${Math.ceil(+r.slice(4,6)/3)} ${r.slice(0,4)}` : (r || "—");
const SEG = {residential:"Home loans", cre:"Commercial RE", business:"Business"};
const KIND = {portfolio:"bank / credit union", private:"private lender", servicer:"servicer", agency:"agency", npl_buyer:"note buyer"};

try { const t = localStorage.getItem("nl-theme"); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
$("#theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("nl-theme", next); } catch(e) {}
};

if (!DATA) {
  $("#hero").innerHTML = "<p>No data yet. Run <span class='mono'>python run.py</span> to build the dashboard.</p>";
  throw new Error("no data");
}

const L = DATA.lenders;
// Inside the Google Apps Script web app the tracker is live; as an email
// attachment the dashboard is read-only.
const LIVE = typeof google !== "undefined" && google.script && google.script.run;
const TRACK = {lenders: {}, contacts: {}, notes: {}};
function call(fn, ...args) {
  return new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args));
}
const state = {view:"lenders", seg:"all", tier:"active", st:"all", q:""};
const gen = new Date(DATA.generated);
$("#slug").innerHTML = `Built <b>${gen.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}</b> · call reports through <b>${qtr(DATA.call_report_quarter)}</b> · ${esc((DATA.states||[]).join(", "))}`;

function hero() {
  const call = L.filter(l => l.tier === "call"), watch = L.filter(l => l.tier === "watch");
  const nw = L.filter(l => l.is_new).length;
  const fc = L.filter(l => l.foreclosures && ["portfolio","private"].includes(l.kind)).length;
  $("#hero").innerHTML = `<p><em>${call.length} lender${call.length===1?"":"s"}</em> worth a call this week, ${watch.length} to watch${nw?`, <span class="hot">${nw} new to the list</span>`:""}. ${fc} bank${fc===1?"":"s"}, credit unions and private lenders ${fc===1?"is":"are"} foreclosing in Massachusetts in their own name.</p>
  <div class="meta">${Object.entries(DATA.sources).map(([k,v]) => `<span><b>${esc(k.toUpperCase())}</b> ${esc(v)}</span>`).join("")}</div>`;
}

function spark(hist) {
  const pts = (hist||[]).filter(h => h.nc_ratio != null);
  if (pts.length < 2) return "";
  const w = 180, h = 36, max = Math.max(...pts.map(p => p.nc_ratio), 0.5);
  const xy = pts.map((p,i) => [i/(pts.length-1)*(w-8)+4, h-4-(p.nc_ratio/max)*(h-10)]);
  const last = xy[xy.length-1];
  return `<svg class="spark" width="${w}" height="${h}" role="img" aria-label="Noncurrent ratio by quarter">
    <polyline fill="none" stroke="var(--blue)" stroke-width="1.6" points="${xy.map(p=>p.join(",")).join(" ")}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--stamp)"/></svg>
    <span class="mono" style="font-size:11px;color:var(--faint)">${qtr(pts[0].repdte)} → ${qtr(pts[pts.length-1].repdte)}</span>`;
}

function rowHTML(l) {
  const b = l.bank || {}, fc = l.foreclosures, tags = [];
  if (l.tier !== "background") tags.push(`<span class="tag t-${l.tier}">${l.tier === "call" ? "worth a call" : "watch"}</span>`);
  (l.hot_segments||[]).forEach(s => tags.push(`<span class="tag t-seg">${SEG[s]||s}</span>`));
  if (l.sold) tags.push(`<span class="tag t-sold">sold notes before</span>`);
  const tr = TRACK.lenders[l.id];
  if (tr && tr.status) tags.push(`<span class="tag t-q">${esc(tr.status)}</span>`);
  if (fc && ["portfolio","private"].includes(l.kind)) tags.push(`<span class="tag t-fc">${fc.count} foreclosure${fc.count===1?"":"s"}</span>`);
  if (l.kind !== "portfolio") tags.push(`<span class="tag t-q">${KIND[l.kind]}</span>`);
  const loc = [l.city, l.state].filter(Boolean).join(", ");
  const side = l.bank ? `<b>${pct(b.nc_ratio)}</b> noncurrent<br>${musd(b.assets)} assets` : (fc ? `<b>${fc.last_90}</b> filed in 90 days` : "");
  const delta = l.score_change ? ` <span class="mono" style="color:${l.score_change>0?"var(--stamp)":"var(--faint)"}">${l.score_change>0?"+":""}${l.score_change}</span>` : "";
  return `<button class="row" data-id="${esc(l.id)}">
    <div class="sc">${l.score}<s>score</s></div>
    <div><p class="nm">${esc(l.name)}${delta}</p><p class="sub">${esc(loc)}${l.why[0] ? " · " + esc(l.why[0]) : ""}</p><div class="tags">${tags.join("")}</div></div>
    <div class="side">${side}</div>${l.is_new ? '<span class="stamp">NEW</span>' : ""}</button>`;
}

function lendersView() {
  const states = [...new Set(L.map(l => l.state).filter(Boolean))].sort();
  const segBtn = (k, t) => `<button class="chip" data-seg="${k}" aria-pressed="${state.seg===k}">${t}</button>`;
  $("#view").innerHTML = `<div class="bar">
      ${segBtn("all","All loans")}${segBtn("residential","Home loans")}${segBtn("cre","Commercial RE")}${segBtn("business","Business")}
      <select class="sel" id="tier" aria-label="Tier"><option value="active">Call + watch</option><option value="call">Worth a call</option><option value="all">Everything</option></select>
      <select class="sel" id="st" aria-label="State"><option value="all">All states</option>${states.map(s=>`<option>${s}</option>`).join("")}</select>
      <input class="srch" id="q" type="search" placeholder="Search lender or town" aria-label="Search">
      <span class="count" id="count"></span></div><div class="rows" id="rows"></div>`;
  $("#tier").value = state.tier; $("#st").value = state.st; $("#q").value = state.q;
  document.querySelectorAll("[data-seg]").forEach(b => b.onclick = () => { state.seg = b.dataset.seg; lendersView(); });
  $("#tier").onchange = e => { state.tier = e.target.value; drawRows(); };
  $("#st").onchange = e => { state.st = e.target.value; drawRows(); };
  $("#q").oninput = e => { state.q = e.target.value.toLowerCase(); drawRows(); };
  drawRows();
}

function drawRows() {
  const list = L.filter(l =>
    (state.tier === "all" || (state.tier === "call" ? l.tier === "call" : l.tier !== "background")) &&
    (state.seg === "all" || (l.hot_segments||[]).includes(state.seg)) &&
    (state.st === "all" || l.state === state.st) &&
    (!state.q || `${l.name} ${l.city}`.toLowerCase().includes(state.q)) &&
    !["servicer","agency"].includes(l.kind));
  $("#count").innerHTML = `<b>${list.length}</b> of ${L.length} lenders`;
  $("#rows").innerHTML = list.length ? list.map(rowHTML).join("") :
    `<div class="empty">Nothing matches. Try “Everything” or another loan type.</div>`;
  $("#rows").querySelectorAll(".row").forEach(r => r.onclick = () => openLender(r.dataset.id));
}

function openLender(id) {
  const l = L.find(x => x.id === id); if (!l) return;
  state.open = id;
  const b = l.bank, p = l.prior || {};
  $("#dname").textContent = l.name;
  $("#dsub").textContent = [KIND[l.kind], [l.city, l.state].filter(Boolean).join(", "), `score ${l.score}`].filter(Boolean).join(" · ");
  let h = `<div class="dsec"><h4>Why it scored</h4><ul class="why">${l.why.map(w=>`<li>${esc(w)}</li>`).join("") || "<li>No signals.</li>"}</ul></div>`;
  if (l.sold) h += soldHTML(l.sold);
  if (l.brief) h += briefHTML(l);
  if (LIVE) h += trackerHTML(l);
  if (b) {
    const d = (b.nc_ratio != null && p.nc_ratio != null) ? b.nc_ratio - p.nc_ratio : null;
    const cu = !!b.basis;

/* ---- bid per note ---- */
const BD = DATA.bid_defaults || {};
function price(v, months, rate) {
  const holding = months * (v * BD.tax_insurance_pct_per_year / 12 + BD.servicing_monthly);
  const costs = v * (BD.resale_cost_pct + BD.repair_reserve_pct) + BD.legal_costs + holding;
  const net = v - costs;
  return {net, costs, bid: Math.max(0, Math.round(net / Math.pow(1 + rate, months / 12) / 500) * 500)};
}
function filingHTML(l, x, i) {
  const bd = x.bid || {};
  let line = "";
  if (bd.skip) line = `<span class="bidline muted">${esc(bd.flags[0])}</span>`;
  else if (bd.bid != null) line = `<span class="bidline">Bid about <b>${usd(bd.bid)}</b> <span class="muted">(${usd(bd.bid_low)}–${usd(bd.bid_high)}) · ${usd(bd.value)} ${esc(bd.value_source)} · ${bd.months} mo</span></span>`;
  else if (bd.months) line = `<span class="bidline muted">No assessed value found — ${bd.months} mo timeline; enter a value in the calculator</span>`;
  return `<div class="item"><b>${esc(x.street)}, ${esc(x.city)}</b>${(l.new_filings||[]).includes(x.case_number)?' <span class="tag t-call">new</span>':""}
    <s>${esc(x.case_number)} · filed ${esc(x.filed_date||"?")} · ${esc(x.county)} County${x.is_estate?" · estate":""}${x.is_reverse_mortgage?" · reverse mortgage":""}</s>
    ${line}${bd.skip ? "" : `<details class="calc" data-i="${i}"><summary>Calculator</summary>
      <div class="calcgrid">
        <label>Value $<input type="number" step="1000" data-k="v" value="${bd.value||""}"></label>
        <label>Unpaid balance $<input type="number" step="1000" data-k="upb" placeholder="from seller"></label>
        <label>Months to resolve<input type="number" step="1" data-k="m" value="${bd.months||""}"></label>
        <label>Target return %<input type="number" step="1" data-k="r" value="${Math.round((BD.target_annual_return||.2)*100)}"></label>
      </div><p class="calcout" aria-live="polite"></p>
      ${(bd.flags||[]).map(f=>`<p class="sub">• ${esc(f)}</p>`).join("")}
      ${bd.timeline_basis ? `<p class="sub">Timeline: ${esc(bd.timeline_basis)} + ${BD.months_after_servicemembers} mo notice, sale and resale.</p>` : ""}
    </details>`}</div>`;
}
function calc(d) {
  const g = k => parseFloat(d.querySelector(`[data-k="${k}"]`).value);
  const v = g("v"), upb = g("upb"), m = g("m"), r = g("r") / 100, out = d.querySelector(".calcout");
  if (!(v > 0) || !(m > 0) || !(r >= 0)) { out.textContent = "Enter a value and a timeline."; return; }
  const p = price(v, m, r);
  let s = `Net at resolution ${usd(p.net)} after ${usd(p.costs)} in costs → bid up to ${usd(p.bid)} (${Math.round(p.bid / v * 100)}% of value).`;
  if (upb > 0 && p.bid > upb) s += ` Capped at the unpaid balance: ${usd(upb)}.`;
  else if (upb > 0) s += ` That's ${Math.round(p.bid / upb * 100)}¢ on the dollar of balance.`;
  out.textContent = s;
}

function wireTracker(l) {
  const msg = t => { const m = $("#t-msg"); if (m) m.textContent = t; };
  $("#t-save").onclick = async () => {
    msg("Saving…");
    try { TRACK.lenders[l.id] = {...TRACK.lenders[l.id], ...await call("saveLender", l.id,
            {status: $("#t-status").value, follow_up: $("#t-follow").value, calendar: $("#t-cal").checked}, snapOf(l))};
          msg("Saved"); drawRowsIfOpen(); }
    catch (e) { msg(e.message || "Couldn't save"); }
  };
  $("#c-add").onclick = async () => {
    const c = {name: $("#c-name").value.trim(), title: $("#c-title").value.trim(), phone: $("#c-phone").value.trim(), email: $("#c-email").value.trim()};
    if (!c.name) return;
    try { (TRACK.contacts[l.id] = TRACK.contacts[l.id] || []).push(await call("addContact", l.id, c, snapOf(l))); openLender(l.id); }
    catch (e) { msg(e.message); }
  };
  $("#n-add").onclick = async () => {
    const text = $("#n-text").value.trim(); if (!text) return;
    try { (TRACK.notes[l.id] = TRACK.notes[l.id] || []).push(await call("addNote", l.id, text, snapOf(l))); openLender(l.id); }
    catch (e) { msg(e.message); }
  };
  const rd = $("#redraft");
  if (rd) rd.onclick = async () => {
    rd.textContent = "Writing…"; rd.disabled = true;
    try {
      const facts = {lender: l.name, kind: KIND[l.kind], city: l.city, state: l.state, points: l.brief.points,
                     ask: l.brief.ask, named_loans: l.brief.named_loans, contacts: TRACK.contacts[l.id] || [],
                     notes: (TRACK.notes[l.id] || []).slice(-5).map(n => n.text), template: l.brief.letter};
      TRACK.lenders[l.id] = {...TRACK.lenders[l.id], ...await call("draftLetter", l.id, facts, snapOf(l))};
      openLender(l.id); const d = document.querySelector("#dbody details.letter"); if (d) d.open = true;
    } catch (e) { rd.textContent = e.message || "Couldn't write it"; rd.disabled = false; }
  };
}

    <ul class="status">
      <li><b>Noncurrent</b> 90+ days past due or on nonaccrual — the definition of a non-performing loan.</li>
      <li><b>Trend</b> noncurrent ratio now vs a year ago. Rising means pressure is building.</li>
      <li><b>Texas ratio</b> bad loans + foreclosed property ÷ capital + reserves. Over 50% the bank is under real pressure to shed bad assets.</li>
      <li><b>Leverage</b> tier 1 capital ÷ assets. Under 7% is thin; selling bad loans frees capital.</li>
      <li><b>Size</b> community banks ($100M–$10B) sell one note or a small pool by phone. Money-center banks sell only large pools at auction.</li>
      <li><b>Foreclosures</b> from Deedline's Land Court feed. A bank or private lender foreclosing in its own name holds that exact note.</li>
      <li><b>SBA</b> charge-offs from the SBA's loan-level FOIA file.</li>
      <li><b>Proven seller</b> a recorded assignment to a note buyer, a foreclosure refiled by a new owner mid-case, or a caption naming the lender as seller. The strongest signal on the list.</li>
      <li><b>Credit unions</b> NCUA call reports, which count loans 60+ days late (banks: 90+).</li>
      <li><b>Bid</b> assessed value, less resale, repair, legal and holding costs over a measured Massachusetts foreclosure timeline, discounted at your target return. Never above the unpaid balance.</li>
    </ul>
    <p class="cite">Before you buy: servicing residential mortgage notes in Massachusetts requires a licensed servicer, and foreclosure-related outreach to homeowners is regulated (940 CMR 25.00). Buy through an entity, use a licensed servicer, and have counsel review the first few purchases.</p></div>`;
}

const VIEWS = {lenders: lendersView, foreclosing: foreclosingView, business: businessView, sellers: sellersView,
               buyers: buyersView, pipeline: pipelineView, about: aboutView};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  state.view = t.dataset.view; VIEWS[state.view](); window.scrollTo(0, 0);
});
hero(); lendersView();
if (LIVE) {
  $("#tab-pipeline").hidden = false;
  call("getTracker").then(t => { Object.assign(TRACK, t); VIEWS[state.view](); if (state.open) openLender(state.open); })
    .catch(e => console.error(e));
}
</script>
