# One-click deploy on Render (https://render.com). The persistent disk keeps
# applications and documents across deploys. Set the secret env vars in the
# Render dashboard after the first deploy.
services:
  - type: web
    name: dibiasio-apply
    runtime: node
    rootDir: dibiasio-apply
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/public/config
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DATA_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CREDIT_SCREENING_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
